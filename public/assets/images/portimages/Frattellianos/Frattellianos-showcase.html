<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frattellianos — composição da capa</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        scrollbar-width: none;
      }
      body {
        margin: 0;
        background: #08090b;
      }
      .showcase {
        position: relative;
        isolation: isolate;
        width: 1600px;
        height: 1600px;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 95% 30%, #9f17145c, transparent 52%),
          radial-gradient(ellipse at 28% 94%, #b82a2a33, transparent 45%),
          linear-gradient(145deg, #202024, #0b0b0e 52%, #151013);
      }
      .showcase::before {
        content: '';
        position: absolute;
        inset: 48% -30% -60%;
        border-radius: 50%;
        border-top: 2px solid #f0b5b51c;
        background: linear-gradient(#ffffff04, #00000066);
        transform: rotate(-18deg);
      }
      .brand {
        position: absolute;
        top: 30px;
        left: 75px;
        width: 350px;
        height: auto;
        mix-blend-mode: lighten;
      }
      .ground-shadow {
        position: absolute;
        top: 1130px;
        left: 400px;
        width: 1550px;
        height: 115px;
        background: #000c;
        border-radius: 50%;
        filter: blur(42px);
        transform: rotate(-7deg);
      }
      .laptop {
        position: absolute;
        top: 70px;
        left: 300px;
        width: 1900px;
        transform: perspective(3000px) rotateY(-8deg) rotateX(3deg) rotateZ(-9deg);
        filter: drop-shadow(-12px 40px 26px #0009);
      }
      .display {
        position: relative;
        padding: 26px 18px 32px;
        border: 2px solid #77777b;
        border-radius: 27px 27px 12px 12px;
        background: linear-gradient(135deg, #424247, #09090b 35%, #202025);
        box-shadow:
          inset 0 0 0 4px #111114,
          0 2px 1px #ffffff50;
      }
      .display::before {
        content: '';
        position: absolute;
        top: 11px;
        left: calc(50% - 4px);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #08090c;
        box-shadow: inset 0 0 0 2px #3a3b40;
      }
      .display img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 4px;
      }
      .base {
        position: relative;
        width: 2060px;
        height: 23px;
        margin-left: -80px;
        border-radius: 3px 3px 50% 50% / 3px 3px 20px 20px;
        background: linear-gradient(#b6b6bd, #73737c 23%, #35353d 74%, #111115);
        box-shadow: 0 3px 1px #0008;
      }
      .base::before {
        content: '';
        position: absolute;
        top: 0;
        left: 815px;
        width: 430px;
        height: 9px;
        border-radius: 0 0 12px 12px;
        background: linear-gradient(#5d5d66, #a0a0aa);
      }
      @media (width <= 800px) {
        .showcase {
          zoom: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <main class="showcase" aria-label="Frattellianos em notebook ampliado">
      <img
        class="brand"
        src="Frattellianos-logo.png"
        alt="Frattellianos"
        width="823"
        height="501"
      />
      <div class="ground-shadow" aria-hidden="true"></div>
      <div class="laptop">
        <div class="display">
          <img
            src="Frattellianos-main.png"
            alt="Interface desktop do site Frattellianos"
            width="1884"
            height="930"
          />
        </div>
        <div class="base" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
